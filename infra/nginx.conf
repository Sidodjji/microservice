events {}
http {
 resolver 127.0.0.11 valid=10s ipv6=off;
 server {
  listen 8080;
  set $fleet http://fleet-service:8080;
  set $identity http://identity-service:8080;
  set $billing http://billing-service:8080;
  set $telemetry http://telemetry-service:8080;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  location /api/cars { proxy_pass $fleet; }
  location /api/bookings { proxy_pass $fleet; }
  location /api/auth { proxy_pass $identity; }
  location /api/billing { proxy_pass $billing; }
  location /api/telemetry { proxy_pass $telemetry; }
  location = /actuator/health { proxy_pass $fleet; }
  location = /v3/api-docs/swagger-config {
   default_type application/json;
   return 200 '{"urls":[{"name":"Fleet","url":"/v3/api-docs/fleet"},{"name":"Identity","url":"/v3/api-docs/identity"},{"name":"Billing","url":"/v3/api-docs/billing"},{"name":"Telemetry","url":"/v3/api-docs/telemetry"}]}';
  }
  location = /v3/api-docs/fleet { proxy_pass $fleet/v3/api-docs; }
  location = /v3/api-docs/identity { proxy_pass $identity/v3/api-docs; }
  location = /v3/api-docs/billing { proxy_pass $billing/v3/api-docs; }
  location = /v3/api-docs/telemetry { proxy_pass $telemetry/v3/api-docs; }
  location = /v3/api-docs { default_type application/json; alias /etc/nginx/openapi.json; }
  location /swagger-ui { proxy_pass $fleet; }
  location / { return 404; }
 }
}