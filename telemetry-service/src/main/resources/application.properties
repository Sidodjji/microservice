spring.application.name=telemetry-service
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/telemetry?connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:telemetry}
spring.datasource.password=${DB_PASSWORD:telemetry}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-random-32-byte-value}
app.jwt.expiration-minutes=60
management.endpoints.web.exposure.include=health
